<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ventana de Mantenimiento</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-rgb: 37, 99, 235;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #2a2e37;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-rgb: 59, 130, 246;
      --good: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --input-bg: #12141a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --card-bg: #1a1d23;
    --text: #e5e7eb;
    --text-muted: #9ca3af;
    --border: #2a2e37;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-rgb: 59, 130, 246;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --input-bg: #12141a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .back-link {
    display: inline-block;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 24px; }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 18px;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 70px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-submit {
    width: 100%;
    margin-top: 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px -4px rgba(var(--accent-rgb), 0.55), 0 2px 4px rgba(var(--accent-rgb), 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: background 0.15s, transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-submit:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 9px 22px -4px rgba(var(--accent-rgb), 0.6), 0 3px 6px rgba(var(--accent-rgb), 0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-submit:active {
    transform: translateY(1px);
    box-shadow: 0 2px 8px -2px rgba(var(--accent-rgb), 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .msg {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: rgba(22,163,74,0.12); color: var(--good); }
  .msg.warn { background: rgba(217,119,6,0.12); color: var(--warn); }
  .msg.bad { background: rgba(220,38,38,0.12); color: var(--bad); }
  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver</a>
  <div class="card">
    <h1>Registrar ventana de mantenimiento</h1>
    <form id="form-ventana">
      <label for="proyecto">Proyecto</label>
      <input type="text" id="proyecto" name="proyecto" required placeholder="Ej. Servidor Ingenio">

      <label for="finalidad">Finalidad de la ventana</label>
      <input type="text" id="finalidad" name="finalidad" required placeholder="Ej. Actualización de firmware">

      <div class="row2">
        <div>
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>
        <div>
          <label for="hora">Hora de inicio</label>
          <input type="time" id="hora" name="hora" required>
        </div>
      </div>

      <label for="duracion">Tiempo de la ventana (horas)</label>
      <input type="number" id="duracion" name="duracion" step="0.5" min="0.5" required placeholder="Ej. 2">

      <label for="solicitadaPor">Solicitada por</label>
      <input type="text" id="solicitadaPor" name="solicitadaPor" required placeholder="Nombre de quien solicita">

      <label for="acceso">Enlace de acceso</label>
      <textarea id="acceso" name="acceso" placeholder="Proporciona el enlace (liga de reunión, VPN, TeamViewer, etc.)"></textarea>
      <div class="hint">Esta información solo la verán las personas del calendario, no aparece en el historial público.</div>

      <button type="submit" class="btn-submit" id="btn-submit">Registrar</button>

      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script>
  // TODO: pegar aquí la URL /exec del Web App de Apps Script una vez desplegado.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx2tOrhMNiF9TQoTCd0J0rl-H46tjNhZUwo3ZpnJHPF_vNo4xpND1JID3QywqCTvq4Q/exec';

  const form = document.getElementById('form-ventana');
  const btn = document.getElementById('btn-submit');
  const msg = document.getElementById('msg');

  function mostrarMensaje(texto, tipo) {
    msg.textContent = texto;
    msg.className = 'msg show ' + tipo;
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Registrando…';
    msg.className = 'msg';

    const payload = {
      proyecto: document.getElementById('proyecto').value.trim(),
      finalidad: document.getElementById('finalidad').value.trim(),
      fecha: document.getElementById('fecha').value,
      hora: document.getElementById('hora').value,
      duracion: document.getElementById('duracion').value,
      solicitadaPor: document.getElementById('solicitadaPor').value.trim(),
      acceso: document.getElementById('acceso').value.trim()
    };

    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        // text/plain evita el preflight CORS que Apps Script Web Apps no maneja bien.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.error) {
        mostrarMensaje('Error: ' + data.error, 'bad');
      } else if (data.ok) {
        mostrarMensaje('Ventana registrada y creada en todos los calendarios. Regresando…', 'ok');
        form.reset();
        setTimeout(() => { window.location.href = 'https://solisgruponxt.github.io/ventanas-solicitudes/index.html'; }, 1500);
      } else {
        mostrarMensaje('Registrada con incidencias: ' + data.estatus + '. Regresando…', 'warn');
        form.reset();
        setTimeout(() => { window.location.href = 'https://solisgruponxt.github.io/ventanas-solicitudes/index.html'; }, 1500);
      }
    } catch (err) {
      mostrarMensaje('No se pudo conectar con el servidor. Intenta de nuevo.', 'bad');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Registrar';
    }
  });
</script>
</body>
</html>
