<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ventana de Mantenimiento</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-rgb: 37, 99, 235;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --input-bg: #ffffff;
    --box-bg: #f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #2a2e37;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-rgb: 59, 130, 246;
      --good: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --input-bg: #12141a;
      --box-bg: #12141a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --card-bg: #1a1d23;
    --text: #e5e7eb;
    --text-muted: #9ca3af;
    --border: #2a2e37;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-rgb: 59, 130, 246;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --input-bg: #12141a;
    --box-bg: #12141a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .back-link {
    display: inline-block;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 24px; }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 18px;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 70px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px 18px;
    margin-top: 18px;
    background: var(--box-bg);
  }
  .box-titulo { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; }
  .acceso-preview {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .acceso-preview img {
    max-width: 140px;
    max-height: 90px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .acceso-preview-quitar {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .acceso-preview-quitar:hover { color: var(--bad); border-color: var(--bad); }
  .btn-submit {
    width: 100%;
    margin-top: 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px -4px rgba(var(--accent-rgb), 0.55), 0 2px 4px rgba(var(--accent-rgb), 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: background 0.15s, transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-submit:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 9px 22px -4px rgba(var(--accent-rgb), 0.6), 0 3px 6px rgba(var(--accent-rgb), 0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-submit:active {
    transform: translateY(1px);
    box-shadow: 0 2px 8px -2px rgba(var(--accent-rgb), 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .msg {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: rgba(22,163,74,0.12); color: var(--good); }
  .msg.warn { background: rgba(217,119,6,0.12); color: var(--warn); }
  .msg.bad { background: rgba(220,38,38,0.12); color: var(--bad); }
  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver</a>
  <div class="card">
    <h1>Registrar ventana de mantenimiento</h1>
    <form id="form-ventana">
      <label for="permisionario">Permisionario</label>
      <select id="permisionario" name="permisionario" required></select>

      <label for="cliente">Cliente</label>
      <input type="text" id="cliente" name="cliente" placeholder="Nombre del cliente">

      <label for="finalidad">Finalidad de la ventana</label>
      <input type="text" id="finalidad" name="finalidad" required placeholder="Ej. Actualización de firmware">

      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" name="fecha" required>

      <div class="row2">
        <div>
          <label for="hora">Hora de inicio</label>
          <input type="time" id="hora" name="hora" required>
        </div>
        <div>
          <label for="horaFin">Hora de término</label>
          <input type="time" id="horaFin" name="horaFin" required>
        </div>
      </div>

      <label for="utc">Zona horaria (UTC)</label>
      <select id="utc" name="utc" required></select>

      <div class="box">
        <div class="box-titulo">Solicitada por</div>
        <label for="solicitanteNombre">Nombre</label>
        <input type="text" id="solicitanteNombre" name="solicitanteNombre" required placeholder="Nombre de quien solicita">
        <label for="solicitanteCorreo">Correo</label>
        <input type="email" id="solicitanteCorreo" name="solicitanteCorreo" required multiple placeholder="correo@dominio.com, otro@dominio.com">
        <div class="hint">Puedes agregar varios correos: sepáralos con una coma (,).</div>
        <label for="solicitanteTelefono">Teléfono</label>
        <input type="tel" id="solicitanteTelefono" name="solicitanteTelefono" placeholder="Ej. 55 1234 5678">
      </div>

      <label for="tipoConexion">Tipo de conexión</label>
      <select id="tipoConexion" name="tipoConexion" required>
        <option value="" disabled selected>Selecciona una opción</option>
        <option value="TeamViewer">TeamViewer</option>
        <option value="AnyDesk">AnyDesk</option>
        <option value="Meet">Meet</option>
        <option value="Teams">Teams</option>
        <option value="Remote Desktop">Remote Desktop</option>
        <option value="Otro">Otro</option>
      </select>

      <label for="acceso">Liga, acceso o imagen</label>
      <textarea id="acceso" name="acceso" placeholder="Escribe la liga/acceso, o pega una imagen aquí (Ctrl+V)"></textarea>
      <div class="acceso-preview" id="acceso-preview" hidden>
        <img id="acceso-preview-img" alt="Vista previa del acceso">
        <button type="button" class="acceso-preview-quitar" id="acceso-preview-quitar">Quitar imagen</button>
      </div>
      <div class="hint" id="acceso-hint">Esta información solo la verán las personas del calendario, no aparece en el historial público. Puedes escribir texto o pegar (Ctrl+V) una imagen.</div>

      <button type="submit" class="btn-submit" id="btn-submit">Registrar</button>

      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script src="utc-offsets.js"></script>
<script src="permisionarios.js"></script>
<script>
  // TODO: pegar aquí la URL /exec del Web App de Apps Script una vez desplegado.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx2tOrhMNiF9TQoTCd0J0rl-H46tjNhZUwo3ZpnJHPF_vNo4xpND1JID3QywqCTvq4Q/exec';

  poblarSelectUTC(document.getElementById('utc'), '-06:00');
  poblarSelectPermisionario(document.getElementById('permisionario'));

  const form = document.getElementById('form-ventana');
  const btn = document.getElementById('btn-submit');
  const msg = document.getElementById('msg');

  function mostrarMensaje(texto, tipo) {
    msg.textContent = texto;
    msg.className = 'msg show ' + tipo;
  }

  // --- Acceso: texto libre o imagen pegada (Ctrl+V) ---
  let accesoImagenBase64 = null;
  let accesoImagenMime = null;

  const accesoTextarea = document.getElementById('acceso');
  const accesoPreview = document.getElementById('acceso-preview');
  const accesoPreviewImg = document.getElementById('acceso-preview-img');
  const accesoHint = document.getElementById('acceso-hint');
  const tipoConexionSelect = document.getElementById('tipoConexion');

  const ACCESO_PLACEHOLDER_GENERAL = accesoTextarea.placeholder;
  const ACCESO_PLACEHOLDER_TEAMS = 'Pega la liga de la reunión de Teams (https://teams.microsoft.com/...), o una imagen (Ctrl+V)';
  const ACCESO_HINT_GENERAL = accesoHint.textContent;
  const ACCESO_HINT_TEAMS = 'Obligatorio para Teams: pega la liga de la reunión o una imagen con los datos de acceso. Solo la verán las personas del calendario.';

  // Mismo patrón que Code.gs (LIGA_TEAMS_RE): Teams empresarial y personal. Se busca
  // dentro del texto para aceptar la invitación completa (liga + ID + código).
  const LIGA_TEAMS_RE = /https:\/\/teams\.(microsoft|live)\.com\/\S+/i;

  function esTeams() {
    return tipoConexionSelect.value === 'Teams';
  }

  function actualizarCampoAcceso() {
    if (accesoImagenBase64) return; // mientras haya imagen se conserva su placeholder
    accesoTextarea.placeholder = esTeams() ? ACCESO_PLACEHOLDER_TEAMS : ACCESO_PLACEHOLDER_GENERAL;
    accesoHint.textContent = esTeams() ? ACCESO_HINT_TEAMS : ACCESO_HINT_GENERAL;
  }

  tipoConexionSelect.addEventListener('change', actualizarCampoAcceso);

  function quitarImagenAcceso() {
    accesoImagenBase64 = null;
    accesoImagenMime = null;
    accesoPreview.hidden = true;
    accesoPreviewImg.src = '';
    accesoTextarea.disabled = false;
    actualizarCampoAcceso();
  }

  accesoTextarea.addEventListener('paste', (ev) => {
    const items = ev.clipboardData && ev.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.indexOf('image/') === 0) {
        ev.preventDefault();
        const file = item.getAsFile();
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          accesoImagenBase64 = dataUrl.split(',')[1];
          accesoImagenMime = file.type;
          accesoPreviewImg.src = dataUrl;
          accesoPreview.hidden = false;
          accesoTextarea.value = '';
          accesoTextarea.disabled = true;
          accesoTextarea.placeholder = 'Imagen adjunta (ver vista previa abajo)';
        };
        reader.readAsDataURL(file);
        return;
      }
    }
  });

  document.getElementById('acceso-preview-quitar').addEventListener('click', quitarImagenAcceso);

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();

    const fechaVal = document.getElementById('fecha').value;
    const horaVal = document.getElementById('hora').value;
    const horaFinVal = document.getElementById('horaFin').value;
    const utcVal = document.getElementById('utc').value;

    const hoyStr = new Date().toISOString().slice(0, 10);
    if (!fechaVal || fechaVal < hoyStr) {
      mostrarMensaje('La fecha no puede ser anterior a hoy.', 'bad');
      return;
    }
    if (!horaVal || !horaFinVal || horaFinVal <= horaVal) {
      mostrarMensaje('La hora de término no puede ser menor o igual a la hora de inicio.', 'bad');
      return;
    }

    const inicio = new Date(fechaVal + 'T' + horaVal + ':00' + utcVal);
    const horasAnticipacion = (inicio.getTime() - Date.now()) / (1000 * 60 * 60);

    if (isNaN(inicio.getTime()) || horasAnticipacion < 24) {
      mostrarMensaje('La ventana debe registrarse con al menos 24 horas de anticipación.', 'bad');
      return;
    }

    if (esTeams() && !accesoImagenBase64) {
      const accesoVal = accesoTextarea.value.trim();
      if (!accesoVal) {
        mostrarMensaje('Para conexión por Teams debes pegar la liga de la reunión o una imagen con el acceso.', 'bad');
        return;
      }
      if (!LIGA_TEAMS_RE.test(accesoVal)) {
        mostrarMensaje('No encontramos una liga de Teams válida (https://teams.microsoft.com/... o https://teams.live.com/...).', 'bad');
        return;
      }
    }

    btn.disabled = true;
    btn.textContent = 'Registrando…';
    msg.className = 'msg';

    const payload = {
      permisionario: document.getElementById('permisionario').value.trim(),
      cliente: document.getElementById('cliente').value.trim(),
      finalidad: document.getElementById('finalidad').value.trim(),
      fecha: fechaVal,
      hora: horaVal,
      horaFin: document.getElementById('horaFin').value,
      utc: utcVal,
      solicitanteNombre: document.getElementById('solicitanteNombre').value.trim(),
      solicitanteCorreo: document.getElementById('solicitanteCorreo').value.trim(),
      solicitanteTelefono: document.getElementById('solicitanteTelefono').value.trim(),
      tipoConexion: document.getElementById('tipoConexion').value,
      acceso: accesoImagenBase64 ? '' : accesoTextarea.value.trim(),
      accesoImagenBase64: accesoImagenBase64 || undefined,
      accesoImagenMime: accesoImagenMime || undefined
    };

    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        // text/plain evita el preflight CORS que Apps Script Web Apps no maneja bien.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.error) {
        mostrarMensaje('Error: ' + data.error, 'bad');
      } else if (data.ok) {
        mostrarMensaje('Ventana registrada y creada en todos los calendarios. Regresando…', 'ok');
        form.reset();
        quitarImagenAcceso();
        setTimeout(() => { window.location.href = 'https://solisgruponxt.github.io/ventanas-solicitudes/index.html'; }, 1500);
      } else {
        mostrarMensaje('Registrada con incidencias: ' + data.estatus + '. Regresando…', 'warn');
        form.reset();
        quitarImagenAcceso();
        setTimeout(() => { window.location.href = 'https://solisgruponxt.github.io/ventanas-solicitudes/index.html'; }, 1500);
      }
    } catch (err) {
      mostrarMensaje('No se pudo conectar con el servidor. Intenta de nuevo.', 'bad');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Registrar';
    }
  });
</script>
</body>
</html>
