<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventanas de Mantenimiento</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --muted-pill-bg: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #2a2e37;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --good: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --muted-pill-bg: #262b35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --card-bg: #1a1d23;
    --text: #e5e7eb;
    --text-muted: #9ca3af;
    --border: #2a2e37;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --muted-pill-bg: #262b35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .hero {
    text-align: center;
    padding: 48px 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 32px;
  }
  .hero h1 { margin: 0 0 8px; font-size: 1.6rem; }
  .hero p { margin: 0 0 24px; color: var(--text-muted); }
  .btn-primary {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 1.05rem;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .section-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--muted-pill-bg);
  }
  .pill.good { color: var(--good); }
  .pill.warn { color: var(--warn); }
  .pill.bad { color: var(--bad); }
  .empty, .loading { padding: 32px; text-align: center; color: var(--text-muted); }
  .table-scroll { overflow-x: auto; }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-nav-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cal-month-label { font-weight: 600; font-size: 1rem; text-transform: capitalize; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    min-width: 560px;
  }
  .cal-dow {
    background: var(--card-bg);
    padding: 8px 4px;
    text-align: center;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .cal-day {
    background: var(--card-bg);
    min-height: 84px;
    padding: 6px;
    font-size: 0.75rem;
  }
  .cal-day.other-month { opacity: 0.35; }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-day-num { font-weight: 600; margin-bottom: 4px; }
  .cal-event {
    display: block;
    font-size: 0.66rem;
    padding: 2px 5px;
    border-radius: 5px;
    margin-bottom: 2px;
    background: var(--muted-pill-bg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event.good { color: var(--good); }
  .cal-event.warn { color: var(--warn); }
  .cal-event.bad { color: var(--bad); }
  .cal-event { cursor: pointer; border: none; width: 100%; text-align: left; font-family: inherit; }
  .cal-event:hover { filter: brightness(0.92); }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h2 { margin: 0 0 18px; font-size: 1.15rem; }
  .modal-box label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin: 14px 0 6px;
  }
  .modal-box label:first-of-type { margin-top: 0; }
  .modal-box input, .modal-box textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
  }
  .modal-box textarea { resize: vertical; min-height: 60px; }
  .modal-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 11px; border-radius: 9px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-outline:hover { color: var(--text); border-color: var(--text-muted); }
  .btn-danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn-danger:hover { background: rgba(220,38,38,0.1); }
  .modal-msg { margin-top: 14px; font-size: 0.85rem; padding: 10px 12px; border-radius: 8px; display: none; }
  .modal-msg.show { display: block; }
  .modal-msg.bad { background: rgba(220,38,38,0.12); color: var(--bad); }
  .modal-msg.ok { background: rgba(22,163,74,0.12); color: var(--good); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Ventanas de Mantenimiento</h1>
    <p>Registra tu solicitud y se agenda automáticamente en los calendarios de Medición.</p>
    <a class="btn-primary" href="formulario.html">Registrar ventana de mantenimiento</a>
  </div>

  <div class="section-title">Historial de solicitudes</div>
  <div class="card">
    <div class="table-scroll">
      <table id="tabla-historial">
        <thead>
          <tr>
            <th>Proyecto</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Duración</th>
            <th>Solicitada por</th>
            <th>Estatus</th>
          </tr>
        </thead>
        <tbody id="tbody-historial">
          <tr><td colspan="6" class="loading">Cargando historial…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section-title" style="margin-top: 32px;">Calendario</div>
  <div class="card" style="padding: 16px;">
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev">← Mes anterior</button>
      <div class="cal-month-label" id="cal-label"></div>
      <button class="cal-nav-btn" id="cal-next">Mes siguiente →</button>
    </div>
    <div class="table-scroll">
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
  // TODO: pegar aquí la URL /exec del Web App de Apps Script una vez desplegado.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx2tOrhMNiF9TQoTCd0J0rl-H46tjNhZUwo3ZpnJHPF_vNo4xpND1JID3QywqCTvq4Q/exec';

  function pillFor(estatus) {
    if (!estatus) return '<span class="pill">—</span>';
    if (estatus.indexOf('todos') !== -1) return `<span class="pill good">✓ ${estatus}</span>`;
    if (estatus.indexOf('Parcial') !== -1) return `<span class="pill warn">⚠ ${estatus}</span>`;
    return `<span class="pill bad">✗ ${estatus}</span>`;
  }

  let historialData = [];
  const mesActual = new Date();
  mesActual.setDate(1);
  mesActual.setHours(0, 0, 0, 0);

  const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
                 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  function estatusClass(estatus) {
    if (!estatus) return '';
    if (estatus.indexOf('todos') !== -1) return 'good';
    if (estatus.indexOf('Parcial') !== -1) return 'warn';
    return 'bad';
  }

  async function cargarHistorial() {
    const tbody = document.getElementById('tbody-historial');
    try {
      const res = await fetch(WEB_APP_URL, { method: 'GET' });
      const datos = await res.json();
      historialData = datos;

      if (!datos.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">Aún no hay solicitudes registradas.</td></tr>';
      } else {
        tbody.innerHTML = datos.map(row => `
          <tr>
            <td>${row.proyecto || ''}</td>
            <td>${row.fecha || ''}</td>
            <td>${row.hora || ''}</td>
            <td>${row.duracion || ''} h</td>
            <td>${row.solicitadaPor || ''}</td>
            <td>${pillFor(row.estatus)}</td>
          </tr>
        `).join('');
      }
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No se pudo cargar el historial.</td></tr>';
    }
    renderCalendario();
  }

  function renderCalendario() {
    const grid = document.getElementById('cal-grid');
    const label = document.getElementById('cal-label');
    const year = mesActual.getFullYear();
    const month = mesActual.getMonth();
    label.textContent = `${MESES[month]} ${year}`;

    const porFecha = {};
    historialData.forEach(row => {
      if (!row.fecha) return;
      (porFecha[row.fecha] = porFecha[row.fecha] || []).push(row);
    });

    const diasEnMes = new Date(year, month + 1, 0).getDate();
    const inicioOffset = new Date(year, month, 1).getDay();
    const diasMesAnterior = new Date(year, month, 0).getDate();
    const hoy = new Date();
    const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;

    let html = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');

    for (let i = inicioOffset - 1; i >= 0; i--) {
      html += `<div class="cal-day other-month"><div class="cal-day-num">${diasMesAnterior - i}</div></div>`;
    }

    for (let dia = 1; dia <= diasEnMes; dia++) {
      const fechaStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      const eventos = porFecha[fechaStr] || [];
      const esHoy = fechaStr === hoyStr;

      const eventosHtml = eventos.map(ev => {
        const cls = estatusClass(ev.estatus);
        const titulo = `${ev.proyecto || ''} · ${ev.hora || ''} · ${ev.solicitadaPor || ''}`.replace(/"/g, '&quot;');
        return `<button type="button" class="cal-event ${cls}" title="${titulo}" data-id="${ev.id}">${ev.hora || ''} ${ev.proyecto || ''}</button>`;
      }).join('');

      html += `<div class="cal-day${esHoy ? ' today' : ''}"><div class="cal-day-num">${dia}</div>${eventosHtml}</div>`;
    }

    const totalCeldas = inicioOffset + diasEnMes;
    const sobrante = (7 - (totalCeldas % 7)) % 7;
    for (let dia = 1; dia <= sobrante; dia++) {
      html += `<div class="cal-day other-month"><div class="cal-day-num">${dia}</div></div>`;
    }

    grid.innerHTML = html;
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    mesActual.setMonth(mesActual.getMonth() - 1);
    renderCalendario();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    mesActual.setMonth(mesActual.getMonth() + 1);
    renderCalendario();
  });

  // --- Edición protegida por login (una sola credencial, ver Code.gs) ---
  let sesion = null; // {usuario, password} cacheado en memoria mientras dure la pestaña abierta

  document.getElementById('cal-grid').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.cal-event');
    if (!btn) return;
    abrirModal(btn.dataset.id);
  });

  document.getElementById('modal-overlay').addEventListener('click', (ev) => {
    if (ev.target.id === 'modal-overlay') cerrarModal();
  });

  function cerrarModal() {
    document.getElementById('modal-overlay').classList.remove('show');
  }

  function escapeAttr(v) {
    return String(v == null ? '' : v).replace(/"/g, '&quot;');
  }
  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  }

  async function obtenerVentana(id, credenciales) {
    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'obtener', id, ...credenciales })
      });
      const data = await res.json();
      return data.ok ? data.datos : null;
    } catch (err) {
      return null;
    }
  }

  async function abrirModal(id) {
    if (sesion) {
      const datos = await obtenerVentana(id, sesion);
      if (datos) {
        renderFormEdicion(datos);
        return;
      }
      sesion = null; // la credencial cacheada ya no sirvió, pedir de nuevo
    }
    renderFormLogin(id);
  }

  function renderFormLogin(id) {
    const box = document.getElementById('modal-box');
    box.innerHTML = `
      <h2>Iniciar sesión para editar</h2>
      <label for="mv-usuario">Usuario</label>
      <input type="text" id="mv-usuario" autocomplete="username">
      <label for="mv-password">Contraseña</label>
      <input type="password" id="mv-password" autocomplete="current-password">
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="mv-cancelar">Cancelar</button>
        <button type="button" class="btn btn-accent" id="mv-entrar">Entrar</button>
      </div>
      <div class="modal-msg" id="mv-msg"></div>
    `;
    document.getElementById('modal-overlay').classList.add('show');
    document.getElementById('mv-cancelar').addEventListener('click', cerrarModal);
    document.getElementById('mv-entrar').addEventListener('click', async () => {
      const usuario = document.getElementById('mv-usuario').value.trim();
      const password = document.getElementById('mv-password').value;
      const intento = { usuario, password };
      const datos = await obtenerVentana(id, intento);
      if (datos) {
        sesion = intento;
        renderFormEdicion(datos);
      } else {
        const msg = document.getElementById('mv-msg');
        msg.textContent = 'Usuario o contraseña incorrectos.';
        msg.className = 'modal-msg show bad';
      }
    });
  }

  function renderFormEdicion(datos) {
    const box = document.getElementById('modal-box');
    box.innerHTML = `
      <h2>Editar ventana</h2>
      <label for="mv-proyecto">Proyecto</label>
      <input type="text" id="mv-proyecto" value="${escapeAttr(datos.proyecto)}">
      <div class="modal-row2">
        <div>
          <label for="mv-fecha">Fecha</label>
          <input type="date" id="mv-fecha" value="${escapeAttr(datos.fecha)}">
        </div>
        <div>
          <label for="mv-hora">Hora</label>
          <input type="time" id="mv-hora" value="${escapeAttr(datos.hora)}">
        </div>
      </div>
      <label for="mv-duracion">Duración (horas)</label>
      <input type="number" step="0.5" min="0.5" id="mv-duracion" value="${escapeAttr(datos.duracion)}">
      <label for="mv-solicitadaPor">Solicitada por</label>
      <input type="text" id="mv-solicitadaPor" value="${escapeAttr(datos.solicitadaPor)}">
      <label for="mv-acceso">Acceso para conectarse</label>
      <textarea id="mv-acceso">${escapeHtml(datos.acceso || '')}</textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="mv-eliminar">Eliminar ventana</button>
        <button type="button" class="btn btn-accent" id="mv-guardar">Guardar cambios</button>
      </div>
      <div class="modal-msg" id="mv-msg"></div>
    `;
    document.getElementById('modal-overlay').classList.add('show');

    document.getElementById('mv-guardar').addEventListener('click', async () => {
      const payload = {
        action: 'editar',
        id: datos.id,
        ...sesion,
        proyecto: document.getElementById('mv-proyecto').value.trim(),
        fecha: document.getElementById('mv-fecha').value,
        hora: document.getElementById('mv-hora').value,
        duracion: document.getElementById('mv-duracion').value,
        solicitadaPor: document.getElementById('mv-solicitadaPor').value.trim(),
        acceso: document.getElementById('mv-acceso').value.trim()
      };
      await enviarCambio(payload);
    });

    document.getElementById('mv-eliminar').addEventListener('click', async () => {
      if (!confirm('¿Eliminar esta ventana de los 5 calendarios? Esta acción no se puede deshacer.')) return;
      await enviarCambio({ action: 'eliminar', id: datos.id, ...sesion });
    });
  }

  async function enviarCambio(payload) {
    const msg = document.getElementById('mv-msg');
    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.error) {
        msg.textContent = 'Error: ' + data.error;
        msg.className = 'modal-msg show bad';
        return;
      }
      cerrarModal();
      await cargarHistorial();
    } catch (err) {
      msg.textContent = 'No se pudo conectar con el servidor.';
      msg.className = 'modal-msg show bad';
    }
  }

  cargarHistorial();
  setInterval(cargarHistorial, 20000);
</script>
</body>
</html>
