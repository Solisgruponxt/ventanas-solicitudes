<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventanas de Mantenimiento</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --muted-pill-bg: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #2a2e37;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --good: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --muted-pill-bg: #262b35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --card-bg: #1a1d23;
    --text: #e5e7eb;
    --text-muted: #9ca3af;
    --border: #2a2e37;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --muted-pill-bg: #262b35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .hero {
    text-align: center;
    padding: 48px 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 32px;
  }
  .hero h1 { margin: 0 0 8px; font-size: 1.6rem; }
  .hero p { margin: 0 0 24px; color: var(--text-muted); }
  .btn-primary {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 1.05rem;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .section-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--muted-pill-bg);
  }
  .pill.good { color: var(--good); }
  .pill.warn { color: var(--warn); }
  .pill.bad { color: var(--bad); }
  .empty, .loading { padding: 32px; text-align: center; color: var(--text-muted); }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Ventanas de Mantenimiento</h1>
    <p>Registra tu solicitud y se agenda automáticamente en los calendarios correspondientes.</p>
    <a class="btn-primary" href="formulario.html">Registrar ventana de mantenimiento</a>
  </div>

  <div class="section-title">Historial de solicitudes</div>
  <div class="card">
    <div class="table-scroll">
      <table id="tabla-historial">
        <thead>
          <tr>
            <th>Proyecto</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Duración</th>
            <th>Solicitada por</th>
            <th>Estatus</th>
          </tr>
        </thead>
        <tbody id="tbody-historial">
          <tr><td colspan="6" class="loading">Cargando historial…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // TODO: pegar aquí la URL /exec del Web App de Apps Script una vez desplegado.
  const WEB_APP_URL = 'PON_AQUI_LA_URL_DEL_WEB_APP';

  function pillFor(estatus) {
    if (!estatus) return '<span class="pill">—</span>';
    if (estatus.indexOf('todos') !== -1) return `<span class="pill good">✓ ${estatus}</span>`;
    if (estatus.indexOf('Parcial') !== -1) return `<span class="pill warn">⚠ ${estatus}</span>`;
    return `<span class="pill bad">✗ ${estatus}</span>`;
  }

  async function cargarHistorial() {
    const tbody = document.getElementById('tbody-historial');
    try {
      const res = await fetch(WEB_APP_URL, { method: 'GET' });
      const datos = await res.json();

      if (!datos.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">Aún no hay solicitudes registradas.</td></tr>';
        return;
      }

      tbody.innerHTML = datos.map(row => `
        <tr>
          <td>${row.proyecto || ''}</td>
          <td>${row.fecha || ''}</td>
          <td>${row.hora || ''}</td>
          <td>${row.duracion || ''} h</td>
          <td>${row.solicitadaPor || ''}</td>
          <td>${pillFor(row.estatus)}</td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No se pudo cargar el historial.</td></tr>';
    }
  }

  cargarHistorial();
  setInterval(cargarHistorial, 20000);
</script>
</body>
</html>
